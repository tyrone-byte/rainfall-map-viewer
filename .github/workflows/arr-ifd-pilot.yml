name: Collect ARR IFD pilot
on:
  workflow_dispatch:
    inputs:
      requests:
        description: Maximum NEW coordinate requests (single-file Goolman import is already cached)
        required: true
        type: choice
        default: '5'
        options: ['1', '3', '5']
permissions:
  contents: read
concurrency:
  group: arr-ifd-pilot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed pilot downloads from previous runs
        uses: actions/cache/restore@v4
        with:
          path: |
            data/ifd/locations
            data/ifd/raw
            data/ifd/index.json
          key: arr-ifd-pilot-${{ github.run_id }}
          restore-keys: arr-ifd-pilot-
      - name: Collect at most five new locations, one request every 30 seconds
        env:
          MAX_REQUESTS: ${{ inputs.requests }}
        run: python tools/collect_arr_pilot.py --limit "$MAX_REQUESTS"
      - name: Preserve completed downloads for the next manual run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/ifd/locations
            data/ifd/raw
            data/ifd/index.json
          key: arr-ifd-pilot-${{ github.run_id }}
      - name: Save results and report for review (even if ARR refuses access)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arr-ifd-pilot-results
          path: data/ifd/
          retention-days: 30
