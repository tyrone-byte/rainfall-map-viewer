<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gauge · GaugeView</title><link rel="stylesheet" href="/style.css?v=water-1"><link rel="stylesheet" href="/gauge.css?v=1"><script defer src="/vendor/chart.js"></script><script defer src="/viewer-data.js?v=1"></script><script defer src="/gauge-plots.js?v=separate-4"></script><script defer src="/ifd.js?v=quarter-1"></script><script defer src="/point-ifd.js?v=1"></script><script defer src="/ifd-view.js?v=compact-gauge-3"></script><script defer src="/gauge.js?v=1"></script></head>
<body><header><a id="back" href="/history">← Map</a><h1 id="title">Gauge</h1><a id="newTab" target="_blank" rel="noopener">Open in new tab</a></header>
